general {
    gaps_in = 6
    gaps_out = 18

    border_size = 2
    col.active_border = $color3 $color2 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 0.9
    inactive_opacity = 0.7

    shadow {
        enabled = false
        range = 6
        render_power = 7
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.16
    }
}

animations {
    enabled = yes

    # curves
    bezier = easeOutQuint, 0.23,1, 0.32,1
    bezier = easeInOut,    0.42,0, 0.58,1
    bezier = linear,       0,0, 1,1
    bezier = quick,        0.15,0, 0.1,1

    # animations
    animation = global,        1, 6,   easeOutQuint
    animation = border,        1, 5,   easeOutQuint
    animation = windows,       1, 5,   easeOutQuint
    animation = windowsIn,     1, 4.7, easeOutQuint, slide top
    animation = windowsOut,    1, 3.5, easeInOut,    slide bottom
    animation = fade,          1, 3.2, quick
    animation = layers,        1, 4.5, easeOutQuint
    animation = workspaces,    1, 5.5, easeOutQuint, slidefade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}